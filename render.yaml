services:
  - type: web
    name: ai-assistant
    runtime: docker
    plan: starter            # un disque persistant nécessite un plan payant
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # à saisir dans le tableau de bord Render
      - key: API_TOKEN
        generateValue: true  # code d'accès généré automatiquement
      - key: PUBLIC_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MIN
        value: "15"
      - key: DAILY_MESSAGE_CAP
        value: "500"
