services:
  - type: web
    name: ai-assistant
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-db
          property: connectionString
      - key: API_TOKEN
        generateValue: true
      - key: PUBLIC_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MIN
        value: "15"
      - key: DAILY_MESSAGE_CAP
        value: "500"

databases:
  - name: ai-assistant-db
    databaseName: ai_assistant
    user: ai_assistant
    plan: free
    region: frankfurt
    ipAllowList: []
