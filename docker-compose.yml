services:
  assistant:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY: "true"
    volumes: ["./data:/srv/data"]
    expose: ["8000"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
    depends_on: [assistant]
    restart: unless-stopped
volumes:
  caddy_data:
